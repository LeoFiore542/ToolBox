<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generatore QR — ToolBox</title>
  <meta name="description" content="Genera un codice QR da un link e scaricalo come PNG." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-label="Strumenti" aria-hidden="true">
    <div class="sidebar-top">
      <a class="brand" href="../index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">ToolBox</span>
      </a>
      <button type="button" class="icon-btn" id="sidebar-close" aria-label="Chiudi menu strumenti">
        <span aria-hidden="true">×</span>
      </button>
    </div>

    <p class="sidebar-label">Strumenti</p>
    <nav class="sidebar-nav">
      <a class="sidebar-link is-active" href="qr.html" aria-current="page">
        <span class="sidebar-index">01</span>
        <span class="sidebar-text">
          <span class="sidebar-title">Generatore QR</span>
          <span class="sidebar-desc">Link → codice scaricabile</span>
        </span>
      </a>
    </nav>

    <p class="sidebar-foot">GitHub Pages</p>
  </aside>

  <div class="content">
    <header class="topbar">
      <button
        type="button"
        class="icon-btn menu-btn"
        id="sidebar-toggle"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="Apri menu strumenti"
      >
        <span class="menu-lines" aria-hidden="true"></span>
      </button>
      <a class="brand brand-compact" href="../index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">ToolBox</span>
      </a>
    </header>

    <main class="tool-page">
      <header class="tool-intro">
        <p class="eyebrow">01 · Strumento</p>
        <h1>Generatore QR</h1>
        <p class="tool-intro-text">Incolla un link, genera il codice e scaricalo. Tutto resta nel browser.</p>
      </header>

      <div class="qr-layout">
        <form id="qr-form" class="qr-form" novalidate>
          <label for="qr-url">Link</label>
          <input
            id="qr-url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://esempio.com"
            required
          />
          <p id="qr-error" class="form-error" role="alert" hidden></p>

          <label for="qr-size">Dimensione</label>
          <select id="qr-size" name="size">
            <option value="256">256 × 256</option>
            <option value="512" selected>512 × 512</option>
            <option value="1024">1024 × 1024</option>
          </select>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Genera QR</button>
            <button type="button" id="qr-download" class="btn btn-secondary" disabled>Scarica PNG</button>
          </div>
        </form>

        <div class="qr-preview" aria-live="polite">
          <canvas id="qr-canvas" width="512" height="512" hidden></canvas>
          <div id="qr-placeholder" class="qr-placeholder">
            <p>Il codice QR apparirà qui</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>ToolBox · generatore QR</p>
    </footer>
  </div>

  <script src="../assets/nav.js"></script>
  <script type="module" src="../assets/qr.js"></script>
</body>
</html>
